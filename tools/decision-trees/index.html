<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="把同一份出入境记录放进身份、税务、医保和养老规则里一起看。"><meta name="theme-color" content="#243f48"><title>身份决策树 · 枫居罗盘</title><link rel="stylesheet" href="/status-compass/theme.css"><link rel="stylesheet" href="/status-compass/_astro/Base.lrx91HLI.css"><!-- vf:start --><meta name="vf-version" content="2026.09.30.2"><link rel="stylesheet" href="/status-compass/vf/framework.css"><style>body[data-vf-site]{--vf-accent:#243f48;--vf-paper:#f7f4ec;--vf-heading:"Songti SC", Georgia, serif;--vf-radius:18px;}</style><script defer src="/status-compass/vf/framework.js"></script><!-- vf:end --></head><body data-vf-site="status-compass"><!-- vf:start --><nav class="vf-network" aria-label="微出国跨站导航" data-pagefind-ignore><a class="vf-wordmark" href="https://veryvisa.github.io/">微出国<span> / VERYVISA</span></a><span class="vf-network-label">枫居罗盘</span><a href="/status-compass/workspace/">我的清单</a><a href="https://veryvisa.github.io/#professional">专业人员入口</a></nav><!-- vf:end --><a class="skip" href="#main">跳到正文</a><header class="mast"><a class="brand" href="/status-compass/"><span aria-hidden="true">⌖</span><span>枫居罗盘<small>Maple Status Compass</small></span></a><nav aria-label="主导航"><a href="/status-compass/tools/day-ledger/">天数总账</a><a href="/status-compass/paths/">按处境找路</a><a href="/status-compass/citizenship-test/">入籍练习</a><a href="/status-compass/how-it-works/">怎么算的</a></nav></header><main id="main"><div class="wrap tool-shell"><header class="tool-head"><p class="eyebrow">先分位置与目标，再谈表格</p><h1>三棵树，把不能混的决定拆开</h1><p class="lede">选择一棵树与当前事实，工具只给下一步入口和后果提醒，不替 IRCC 作资格结论。</p></header><div class="tool-grid"><form class="panel fields" data-tree-form><div class="field"><label for="tree">我要决定什么</label><select id="tree" name="tree"><option value="pr">续卡、PRTD 还是放弃 PR</option><option value="cit">入籍还是保持 PR</option><option value="renounce">是否放弃加拿大公民身份</option></select></div><div class="field"><label for="location">我现在在哪里</label><select id="location" name="location"><option value="ca">加拿大境内</option><option value="outside">加拿大境外</option></select></div><div class="field"><label for="days">相关天数状态</label><select id="days" name="days"><option value="enough">按完整记录看似达到</option><option value="short">看似不足</option><option value="unknown">还没算清</option></select></div><button type="submit">看下一处分叉</button></form><section class="panel stack" data-tree-result aria-live="polite"><h2>先完成天数总账</h2><p>位置、天数和未来目标会改变入口。</p></section></div></div><script type="module">var e=document.querySelector(`[data-tree-form]`),t=document.querySelector(`[data-tree-result]`),n={pr:{enough:[`先核完整五年记录`,`人在境内可准备 PR 卡申请；境外回加通常看有效卡或 PRTD`,`申请卡片不会创造身份或补足天数`],short:[`先不要把卡片到期当成身份自动消失`,`境外需要 PRTD 时要面对居住义务与可能的人道审查`,`自愿放弃会改变未来入境身份，税务另算`],unknown:[`先从 CBSA、护照与机票重建行程`,`把境外陪同或加拿大企业例外单列证据`,`再决定续卡、PRTD 或放弃`]},cit:{enough:[`核官方计算器并留安全余量`,`对齐报税、语言、考试与禁限条件`,`比较公民旅行权利与原国籍后果`],short:[`看最早达标日而不是抢签申请`,`避免让旧日数滑出五年窗口`,`继续保住 PR 居住义务`],unknown:[`先算入籍五年窗口`,`区分 PR 后整天与 PR 前半天折算`,`再比较入籍或维持 PR`]},renounce:{enough:[`确认已有或获批时会有另一国国籍`,`确认弃籍后的返加身份与家庭后果`,`单独处理税务居民与资产`],short:[`若没有另一国国籍，不能把自己推向无国籍`,`先解决目标国国籍与居住地条件`,`不要用弃籍替代税务离境`],unknown:[`先读一般弃籍条件与特殊取得公民身份路径`,`找目标国国籍律师确认结果`,`再核加拿大税务和返加安排`]}};e?.addEventListener(`submit`,r=>{r.preventDefault();let i=n[e.tree.value][e.days.value];t.innerHTML=`<h2>${e.location.value===`ca`?`你目前在加拿大境内。`:`你目前在加拿大境外。`}</h2><ol class="steps">${i.map(e=>`<li>${e}</li>`).join(``)}</ol><p class="warning">这只是路线分流。正式身份认定、拒签上诉、复杂国籍或人道理由请交给持牌专业人士。</p>`});</script><!-- vf:start --><div class="vf-tools" role="group" data-pagefind-ignore aria-label="阅读工具"><button type="button" data-vf-save hidden>保存本页</button><button type="button" data-vf-print hidden>打印 / 存为 PDF</button><span data-vf-status role="status" aria-live="polite"></span></div><!-- vf:end --></main><footer><p><strong>这是规划工具，不是个案裁决。</strong> 税务居民、PR 例外、离境税和资格争议必须回到主管机构原文，并在需要时找持牌移民或税务专业人士。</p><p><a href="/status-compass/sources/">规则与官方来源</a> · <a href="https://bbs.fcgvisa.com/">枫出国论坛</a> · 数据只留在当前浏览器</p></footer></body></html>
